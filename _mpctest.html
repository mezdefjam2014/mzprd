<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mpc tab test</title>
<style>:root{--gold:#e8b94a;--red:#e0242f}body{margin:0;background:#050506;color:#fff;font:13px Montserrat,sans-serif;padding:16px}</style>
<div id="mpcmk"></div>
<script>
window.pub=p=>p;window.askConfirm=()=>Promise.resolve(true);
const NAMES=['Midnight Run','Cold Crown','Velvet Rain','Iron Garden','Late Bus','Salt Water','No Sleep','Gold Teeth','Neon Alley','Paper Planes','Hard Reset','Slow Burn','Low Tide','Static','Night Shift','Glass Rain','Heavy Hands','Wave Check','Ten Toes','Last Call'];
const BEATS=NAMES.map((n,i)=>({id:'b'+i,title:n,bpm:80+i*3,musical_key:['Fm','Am','Dm','Gm'][i%4],preview_path:'demo.wav',cover_path:null,slug:n.toLowerCase().replace(/[^a-z0-9]+/g,'-'),tags:'Hip Hop'}));
function mk(table){const p=Promise.resolve({data:table==='beats'?BEATS:[]});const q={select(){return q},order(){return q},then:(a,b)=>p.then(a,b)};return q}
window.sb={from:mk};
window.loadScript=f=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=f;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
document.write('<script src="mpc.js?'+Date.now()+'"><\/script>');
</script>
<script>setTimeout(()=>{mpcOpen().then(()=>{window.ready=1}).catch(e=>{window.err=String(e&&e.stack||e)})},300)</script>
