<!doctype html><meta charset=utf-8><style>body{background:#050506;color:#fff;font:13px sans-serif}.bi{display:grid;gap:14px;padding:10px;border:1px solid #333;margin:4px;width:500px}.bi.bx{grid-template-columns:26px 56px 1fr auto}.bi .dh{width:26px;height:44px;display:grid;place-items:center;color:#777;font-size:18px;cursor:grab;touch-action:none;user-select:none;border:1px dashed #333}.bi .dh:hover{color:#fff;border-color:#777}
.bi.drag{outline:2px solid var(--gold);background:#16140c;opacity:.92}.bi .acts .pv{border-color:var(--gold);color:var(--gold)}.bi .acts .pv.on{background:var(--gold);color:#000}
.bi.gp{grid-template-columns:1fr auto;border-color:var(--gold)}.bi.gp input{width:96px;background:#000;border:1px solid #4a4a50;color:#fff;padding:9px;font:600 13px Montserrat}.bi.gp .acts{align-items:center}
</style>
<div id="bl"><div class="bi bx" data-id="1"><div class="dh">&#9776;</div><div><b>BEAT 1</b></div></div><div class="bi bx" data-id="2"><div class="dh">&#9776;</div><div><b>BEAT 2</b></div></div><div class="bi bx" data-id="3"><div class="dh">&#9776;</div><div><b>BEAT 3</b></div></div><div class="bi bx" data-id="4"><div class="dh">&#9776;</div><div><b>BEAT 4</b></div></div></div>
<script>const toast=()=>{};const pub=x=>x;let demoA=null,demoB=null;
function demoStop(){if(demoA){try{demoA.pause()}catch(e){}}if(demoB){demoB.classList.remove('on');demoB.innerHTML='&#9654; DEMO'}demoA=null;demoB=null}
function demoToggle(r,btn){const same=demoB===btn;demoStop();if(same)return;
 const a=new Audio(pub(r.preview_path));demoA=a;demoB=btn;btn.classList.add('on');btn.innerHTML='&#9632; STOP';
 a.play().catch(()=>{toast('Could not play this preview');demoStop()});
 a.ontimeupdate=()=>{if(demoA===a){if(a.currentTime>=20)demoStop();else if(a.currentTime>17)a.volume=Math.max(0,(20-a.currentTime)/3)}};a.onended=()=>{if(demoA===a)demoStop()}}
function dragSort(list,onDone){list.querySelectorAll('.bi[data-id] .dh').forEach(h=>{h.onpointerdown=e=>{e.preventDefault();const row=h.closest('.bi');row.classList.add('drag');try{h.setPointerCapture(e.pointerId)}catch(x){}let done=false;
 const mv=ev=>{const t=document.elementFromPoint(ev.clientX,ev.clientY),o=t&&t.closest&&t.closest('.bi[data-id]');if(o&&o!==row&&o.parentNode===list){const r=o.getBoundingClientRect();list.insertBefore(row,ev.clientY<r.top+r.height/2?o:o.nextSibling)}};
 const up=()=>{if(done)return;done=true;['pointermove'].forEach(k=>{h.removeEventListener(k,mv);window.removeEventListener(k,mv)});['pointerup','pointercancel','mouseup','touchend','blur'].forEach(k=>{h.removeEventListener(k,up);window.removeEventListener(k,up)});row.classList.remove('drag');onDone()};
 h.addEventListener('pointermove',mv);window.addEventListener('pointermove',mv);['pointerup','pointercancel','mouseup','touchend','blur'].forEach(k=>{h.addEventListener(k,up);window.addEventListener(k,up)})}})}
window.saved=null;dragSort(document.getElementById('bl'),()=>{window.saved=[...document.querySelectorAll('.bi')].map(x=>x.dataset.id).join(',')});</script>
