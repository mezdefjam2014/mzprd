<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
/* Layout: same light-table look as the Move Library; tabbed lists of planned animations with a pick box each */
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2430;--muted:#5b6878;--line:#cfd6de;--accent:#e0661b;--ok:#1f8a4c;
  --display:"Chakra Petch",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#1b2129;--ink:#e6ebf1;--muted:#97a3b2;--line:#2e3742;--accent:#ff8a3d;--ok:#3cc47a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--panel:#1b2129;--ink:#e6ebf1;--muted:#97a3b2;--line:#2e3742;--accent:#ff8a3d;--ok:#3cc47a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:clamp(26px,5vw,38px);margin:0}
.sub{color:var(--muted);margin:4px 0 0;max-width:68ch;line-height:1.5}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font-family:var(--display);font-weight:700;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .c{font-family:var(--mono);font-weight:400;opacity:.8;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.bar b{font-family:var(--display);color:var(--ok)}
.msg{font-family:var(--mono);font-size:12px;color:var(--muted)}
button.small{font-family:var(--display);font-weight:700;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;min-width:0}
li.on{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
li input{margin-top:3px;width:18px;height:18px;accent-color:var(--ok);flex:none}
li .t{font-weight:600;font-size:14px;line-height:1.3}
li .d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
li .s{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
li label{display:flex;gap:10px;cursor:pointer;min-width:0;flex:1}
input:focus-visible,.tab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

let cur=0, picks=new Set(), db=null;
const tabs=document.getElementById("tabs"), list=document.getElementById("list"), msg=document.getElementById("msg");
function count(i){return LISTS[i].items.filter(x=>picks.has(x.id)).length}
function renderTabs(){tabs.innerHTML="";LISTS.forEach((L,i)=>{const b=document.createElement("button");b.className="tab"+(i===cur?" on":"");b.innerHTML=`${L.title}<span class="c">${count(i)}/${L.items.length}</span>`;b.onclick=()=>{cur=i;render()};tabs.appendChild(b)});document.getElementById("cnt").textContent=picks.size}
function render(){renderTabs();list.innerHTML="";LISTS[cur].items.forEach(x=>{const li=document.createElement("li");li.className=picks.has(x.id)?"on":"";
  li.innerHTML=`<label><input type="checkbox" id="c_${x.id}" ${picks.has(x.id)?"checked":""} ${db?"":"disabled"}><span><div class="t"></div><div class="d"></div><div class="s"></div></span></label>`;
  li.querySelector(".t").textContent=x.n;li.querySelector(".d").textContent=x.d;li.querySelector(".s").textContent="from: "+x.src.join(" + ");
  li.querySelector("input").onchange=e=>set(x.id,e.target.checked);list.appendChild(li)})}
async function set(id,on){if(!db)return;on?picks.add(id):picks.delete(id);render();
  try{const r=db.collection("picks").doc(id);on?await r.set({picked:true}):await r.delete()}catch(e){on?picks.delete(id):picks.add(id);render();msg.textContent="Couldn't save that. Only the page owner can pick."}}
document.getElementById("all").onclick=async()=>{for(const x of LISTS[cur].items)if(!picks.has(x.id))await set(x.id,true)};
document.getElementById("none").onclick=async()=>{for(const x of LISTS[cur].items)if(picks.has(x.id))await set(x.id,false)};
render();
(async()=>{msg.textContent="Loading your picks…";const t=setTimeout(()=>{if(!db)msg.textContent="Picking needs the page open on claude.ai while signed in."},10000);
  db=await window.claude?.use?.("db");if(!db){clearTimeout(t);msg.textContent="Picking needs the page open on claude.ai while signed in.";render();return}
  db.collection("picks").onSnapshot(s=>{clearTimeout(t);picks=new Set(s.docs.filter(d=>d.exists).map(d=>d.id));msg.textContent="Saved automatically.";render()},()=>{msg.textContent="Couldn't load picks right now."})})();
