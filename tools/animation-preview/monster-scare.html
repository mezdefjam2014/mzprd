<title>Monster Scare Storyboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
/* Layout: animator's light-table — playback stage, numbered key panels, paste-ready prompt */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2430; --muted:#5b6878; --line:#cfd6de;
  --accent:#e0661b; --figure:#1b2430; --figure-far:#7d8896; --prop1:#3b4654; --prop2:#e0661b; --prop3:#9aa5b1; --prop4:#2f7fd6;
  --display:"Chakra Petch",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1b2129; --ink:#e6ebf1; --muted:#97a3b2; --line:#2e3742;
  --accent:#ff8a3d; --figure:#e6ebf1; --figure-far:#7b8796; --prop1:#b7c2ce; --prop2:#ff8a3d; --prop3:#5f6b78; --prop4:#5ea8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1b2129; --ink:#e6ebf1; --muted:#97a3b2; --line:#2e3742;
  --accent:#ff8a3d; --figure:#e6ebf1; --figure-far:#7b8796; --prop1:#b7c2ce; --prop2:#ff8a3d; --prop3:#5f6b78; --prop4:#5ea8ff; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--display);font-size:clamp(26px,5vw,38px);margin:0;text-wrap:balance}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
#main{touch-action:none;cursor:grab;width:100%;aspect-ratio:16/9;max-width:100%;display:block}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font-family:var(--display);font-weight:700;font-size:14px;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.views{display:flex;flex-wrap:wrap;gap:6px}
.views button{padding:6px 10px;font-size:12px}
.views button.sel{border-color:var(--accent);color:var(--accent)}
.readout{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:170px}
.readout b{color:var(--ink)}
h2{font-family:var(--display);font-size:20px;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.card.on{border-color:var(--accent)}
.card canvas{width:100%;aspect-ratio:4/3;display:block}
.card .n{font-family:var(--display);font-weight:700;color:var(--accent)}
.card p{margin:0;font-size:13px;line-height:1.35}
.card .f{font-family:var(--mono);font-size:11px;color:var(--muted)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-wrap;font-family:var(--mono);font-size:13px;line-height:1.5;margin:0;overflow-x:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:0;max-width:65ch}
section{display:flex;flex-direction:column;gap:12px}
</style>

<main>
  <header><h1 id="title"></h1><div class="meta" id="meta"></div></header>
  <section class="stage">
    <canvas id="main" width="1280" height="720" aria-label="Animated preview"></canvas>
    <div class="controls">
      <button id="play">Pause</button>
      <button class="ghost" id="onion">Onion skin: off</button>
      <div class="views" id="views" role="group" aria-label="Camera"></div>
      <input type="range" id="scrub" min="1" step="0.1" value="1" aria-label="Frame">
      <div class="readout" id="readout"></div>
    </div>
    <p class="note"><span id="note"></span> Drag the stage to orbit the camera.</p>
  </section>
  <section><h2>Key frames</h2><div class="grid" id="grid"></div></section>
  <section>
    <div class="row"><h2>Prompt</h2><button class="ghost" id="copy">Copy prompt</button></div>
    <pre id="prompt"></pre>
  </section>
</main>

<script>
/*DATA*/
const DATA = {
 "title": "Monster Scare Storyboard",
 "meta": "3D third-person \u00b7 3/4 view \u00b7 24 fps \u00b7 frames 1\u201340 \u00b7 one-shot",
 "note": "A jump scare: slow creepy build-up, then a sudden burst at frame 20 and a lunge at the camera.",
 "fps": 24,
 "props": {},
 "keys": [
  {

   "n": "Monster crouched low in the shadows, hunched over, arms hanging.",
   "pose": {
    "y": 25,
    "lean": 40,
    "head": -15,
    "rU": 110,
    "rF": 100,
    "lU": 115,
    "lF": 105,

    "bT": 60,
    "bS": 145,

    "lO": 12,

    "bO": 15
   }
  },
  {
   "f": 8,
   "n": "Head slowly twitches up toward the camera.",
   "pose": {
    "y": 25,
    "lean": 35,
    "head": -40,
    "rU": 105,
    "rF": 100,
    "lU": 112,
    "lF": 104,
    "fT": 20,
    "fS": 110,
    "bT": 60,
    "bS": 145,
    "rO": 12,
    "lO": 12,
    "fO": 15,
    "bO": 15,

   }
  },
  {

    "head": -30,
    "rU": 150,
    "rF": 160,
    "lU": 145,
    "lF": 155,
    "fT": 10,
    "fS": 115,
    "bT": 55,
    "bS": 151,
    "rO": 20,

  },
  {
   "f": 20,
   "snap": true,
   "n": "Bursts upright, arms flung high, claws spread.",
   "pose": {
    "y": -4,
    "lean": -15,
    "head": -35,
    "rU": -60,
    "rF": -100,
    "lU": -75,
    "lF": -115,
    "fT": 85,
    "fS": 90,
    "bT": 105,
    "bS": 95,
    "rO": 30,
    "lO": 30,
    "fO": 6,
    "bO": 6
   }
  },
  {
   "f": 26,
   "n": "Roars at the camera, head thrown back, arms wide.",
   "pose": {
    "y": 0,
    "lean": -20,
    "head": -45,
    "rU": -30,
    "rF": -60,
    "lU": -120,
    "lF": -150,
    "fT": 82,
    "fS": 92,
    "bT": 103,
    "bS": 95,
    "rO": 50,
    "lO": 50,
    "fO": 6,
    "bO": 6
   }
  },
  {
   "f": 31,
   "snap": true,
   "n": "Lunges forward, both clawed hands reaching at the viewer.",
   "pose": {
    "x": 30,
    "y": 8,
    "lean": 35,
    "head": 0,
    "rU": 5,
    "rF": 0,
    "lU": -5,
    "lF": -10,
    "fT": 40,
    "fS": 95,
    "bT": 130,
    "bS": 110,
    "rO": -6,
    "lO": -6,
    "fO": 8,
    "bO": 8
   }
  },
  {
   "f": 40,
   "n": "Freezes in the lunge, trembling, inches from the camera.",
   "pose": {
    "x": 34,
    "y": 9,
    "lean": 40,
    "head": -5,
    "rU": 8,
    "rF": 2,
    "lU": -3,
    "lF": -8,
    "fT": 42,
    "fS": 95,
    "bT": 132,
    "bS": 110,
    "rO": -8,
    "lO": -8,
    "fO": 8,
    "bO": 8
   }
  }
 ],
 "prompt": "Create a 7-panel 3D animation storyboard of a monster doing a jump scare, viewed from a third-person camera, dark horror style. Lay the panels out left to right, numbered 1 to 7, same monster, camera and scale in every panel. Each panel shows a different moment:\n\n1. Monster crouched low in the shadows, hunched over, arms hanging.\n2. Head slowly twitches up toward the camera.\n3. Sinks even lower, arms pulled back, coiling to spring.\n4. Bursts upright, arms flung high, claws spread.\n5. Roars at the camera, head thrown back, arms wide.\n6. Lunges forward, both clawed hands reaching at the viewer.\n7. Freezes in the lunge, trembling, inches from the camera.\n\nMake panels 1 to 3 slow and creepy and panels 4 to 6 sudden and violent.\nThen animate it in Blender at 24 fps over 40 frames, with the burst on frame 20.",
 "dim": "3D",
 "view": "3/4"
};
/*END DATA*/

// ---------- engine (do not edit per animation) ----------
const D=Math.PI/180;
const L={torso:30,chest:28,neck:7,head:11.5,upper:30,fore:27,thigh:46,shin:45,foot:14,shW:9,hipW:5};
const FLOOR=89;
// relaxed standing pose. Sagittal angles (side view) + 3D: *O = limb swings out to the side, twist = upper body yaw, turn = whole body yaw, look = head yaw
const REST={x:0,y:0,z:0,lean:2,chest:0,head:4,twist:0,turn:0,look:0,
  rU:86,rF:80,lU:93,lF:86,rO:8,lO:8,fT:84,fS:97,bT:95,bS:90,fA:0,bA:0,fO:3,bO:3};
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const dir=(a,o=0,side=1)=>[Math.cos(a*D)*Math.cos(o*D),Math.sin(a*D)*Math.cos(o*D),side*Math.sin(o*D)];
const mul=(v,k)=>[v[0]*k,v[1]*k,v[2]*k];
const limb=(f,a,l,o=0,side=1)=>add(f,mul(dir(a,o,side),l));
function rotY(p,c,t){const dx=p[0]-c[0],dz=p[2]-c[2],C=Math.cos(t*D),S=Math.sin(t*D);return [c[0]+dx*C+dz*S,p[1],c[2]-dx*S+dz*C];}
function rawSolve(p){
  const hip=[p.x,p.y,p.z];
  const mid=limb(hip,-90+p.lean,L.torso);
  const sh=limb(mid,-90+p.lean+p.chest,L.chest);
  const nk=limb(sh,-90+p.lean*.5+p.chest*.5,L.neck);
  const hd=limb(nk,-90+p.lean+p.chest+p.head*.6,L.head);
  let shF=add(sh,[0,0,L.shW]), shB=add(sh,[0,0,-L.shW]);
  let rE=limb(shF,p.rU,L.upper,p.rO,1), rH=limb(rE,p.rF,L.fore,p.rO,1);
  let lE=limb(shB,p.lU,L.upper,p.lO,-1), lH=limb(lE,p.lF,L.fore,p.lO,-1);
  [shF,shB,rE,rH,lE,lH]=[shF,shB,rE,rH,lE,lH].map(q=>rotY(q,sh,p.twist));
  const hF=add(hip,[0,0,L.hipW]), hB=add(hip,[0,0,-L.hipW]);
  const fK=limb(hF,p.fT,L.thigh,p.fO,1), fAn=limb(fK,p.fS,L.shin,p.fO,1), fTo=limb(fAn,p.fA,L.foot);
  const bK=limb(hB,p.bT,L.thigh,p.bO,-1), bAn=limb(bK,p.bS,L.shin,p.bO,-1), bTo=limb(bAn,p.bA,L.foot);
  const face=add(hd,mul(rotY([Math.cos((p.head*.6+p.lean)*D),Math.sin((p.head*.6+p.lean)*D),0],[0,0,0],p.twist+p.look),8));
  const pts={hip,mid,sh,shF,shB,nk,hd,face,rE,rH,lE,lH,hF,hB,fK,fAn,fTo,bK,bAn,bTo};
  if(p.turn)for(const k in pts)pts[k]=rotY(pts[k],hip,p.turn);
  return {...pts,ang:{rH:p.rF,lH:p.lF,fFoot:p.fA,bFoot:p.bA,hip:p.lean,head:p.head,chest:p.lean+p.chest,world:0},
    yaw:{rH:p.turn+p.twist,lH:p.turn+p.twist,chest:p.turn+p.twist,head:p.turn+p.twist+p.look,fFoot:p.turn,bFoot:p.turn,hip:p.turn,world:0}};
}
function ground(k){
  const p={...REST,...(k.pose||{})};
  const s=rawSolve({...p,y:0});
  const low=Math.max(s.fAn[1]+4,s.fTo[1],s.bAn[1]+4,s.bTo[1]);
  p.y=(FLOOR-low)+(k.air?(p.y||0):0);
  return p;
}
const KEYS=DATA.keys.map(k=>({...k,pose:ground(k)}));
const LAST=KEYS[KEYS.length-1].f;
const solve=rawSolve;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ANCH={rH:"rH",lH:"lH",fFoot:"fAn",bFoot:"bAn",hip:"hip",head:"hd",chest:"sh"};
function propXform(s,pr){
  if(!pr)return null;
  if(pr.at==="world")return {pos:[pr.x||0,pr.y||0,pr.z||0],r:pr.r||0,yaw:pr.yaw||0};
  const base=pr.follow?s.ang[pr.at]:0, yaw=s.yaw[pr.at]+(pr.yaw||0);
  const g=base*D,x=pr.x||0,y=pr.y||0;
  const off=rotY([x*Math.cos(g)-y*Math.sin(g),x*Math.sin(g)+y*Math.cos(g),pr.z||0],[0,0,0],yaw);
  return {pos:add(s[ANCH[pr.at]],off),r:base+(pr.r||0),yaw};
}
function frameState(fr){
  fr=Math.max(KEYS[0].f,Math.min(LAST,fr));
  let i=0;while(i<KEYS.length-2&&fr>KEYS[i+1].f)i++;
  const a=KEYS[i],b=KEYS[i+1]||a;
  let t=b.f===a.f?0:(fr-a.f)/(b.f-a.f);
  t=b.snap?1-Math.pow(1-t,3):ease(t);
  const pose={};for(const k in a.pose)pose[k]=a.pose[k]+(b.pose[k]-a.pose[k])*t;
  const sa=solve(a.pose),sb=solve(b.pose),props={};
  const lr=(u,v)=>u+(v-u)*t;
  for(const name in DATA.props){
    const xa=propXform(sa,a.props?.[name]), xb=propXform(sb,b.props?.[name]);
    if(xa&&xb)props[name]={pos:xa.pos.map((v,j)=>lr(v,xb.pos[j])),r:lr(xa.r,xb.r),yaw:lr(xa.yaw,xb.yaw)};
    else if(xa&&t<.5)props[name]=xa; else if(xb&&t>=.5)props[name]=xb;
  }
  return {pose,props};
}
function keyState(k){const s=solve(k.pose),props={};for(const n in DATA.props){const x=propXform(s,k.props?.[n]);if(x)props[n]=x}return {pose:k.pose,props};}

// ---------- camera ----------
const VIEWS={side:[0,8],"3/4":[40,14],front:[90,8],"over shoulder":[-40,14],back:[-90,10],top:[0,70]};
const is2D=/^2d/i.test(DATA.dim||"");
const cam={yaw:0,pitch:8,...(()=>{const v=VIEWS[DATA.view||(is2D?"side":"3/4")]||VIEWS.side;return {yaw:v[0],pitch:v[1]}})()};
const panelCam={...cam};
function proj(p,c){
  const dx=p[0]-6,dy=p[1]-6,dz=p[2];
  const Y=c.yaw*D,Pt=c.pitch*D;
  const x1=dx*Math.cos(Y)-dz*Math.sin(Y), z1=dx*Math.sin(Y)+dz*Math.cos(Y);
  return [x1, dy*Math.cos(Pt)+z1*Math.sin(Pt), -dy*Math.sin(Pt)+z1*Math.cos(Pt)];
}

function draw(ctx,w,h,st,opt={}){
  const c=opt.cam||cam, s=solve(st.pose), sc=h/262;
  ctx.save();ctx.translate(w*.5,h*.5);ctx.scale(sc,sc);ctx.lineCap="round";ctx.lineJoin="round";
  const J=k=>proj(s[k],c);
  const near=opt.ghost?css("--line"):css("--figure"), far=opt.ghost?css("--line"):css("--figure-far");
  if(!opt.ghost){
    // floor disc and contact shadow
    ctx.strokeStyle=css("--line");ctx.lineWidth=1.2;
    for(const r of [40,80]){ctx.beginPath();for(let i=0;i<=48;i++){const a=i/48*2*Math.PI;const q=proj([s.hip[0]+Math.cos(a)*r,FLOOR,s.hip[2]+Math.sin(a)*r],c);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);}ctx.stroke();}
    const lift=Math.max(0,FLOOR-4-Math.max(s.fAn[1],s.bAn[1]));
    ctx.fillStyle=css("--line");ctx.globalAlpha=Math.max(.15,.6-lift/80);ctx.beginPath();
    for(let i=0;i<=24;i++){const a=i/24*2*Math.PI,r=Math.max(10,22-lift/4);const q=proj([s.hip[0]+4+Math.cos(a)*r,FLOOR,s.hip[2]+Math.sin(a)*r*.7],c);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);}
    ctx.fill();ctx.globalAlpha=1;
  }
  const hipD=J("hip")[2];
  const items=[];
  const seg=(a,b,wd)=>{const A=J(a),B=J(b);items.push({d:(A[2]+B[2])/2,f:col=>{ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}});};
  const dot=(a,r)=>{const A=J(a);items.push({d:A[2]+.1,f:col=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(A[0],A[1],r,0,7);ctx.fill();}});};
  seg("hip","hF",10);seg("hip","hB",10);seg("hip","mid",13);seg("mid","sh",16);seg("shF","shB",9);seg("sh","nk",6);
  seg("shF","rE",7);seg("rE","rH",6.5);dot("rH",3.8);
  seg("shB","lE",7);seg("lE","lH",6.5);dot("lH",3.8);
  seg("hF","fK",9);seg("fK","fAn",8);seg("fAn","fTo",6);
  seg("hB","bK",9);seg("bK","bAn",8);seg("bAn","bTo",6);
  // head
  const H=J("hd"),F=J("face");
  items.push({d:H[2],f:col=>{ctx.fillStyle=opt.ghost?"transparent":css("--panel");ctx.strokeStyle=col;ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(H[0],H[1]-1,10.5,0,7);ctx.fill();ctx.stroke();
    if(!opt.ghost&&F[2]>H[2]-3){ctx.fillStyle=col;ctx.beginPath();ctx.arc(H[0]+(F[0]-H[0])*.7,H[1]+(F[1]-H[1])*.7-2,1.9,0,7);ctx.fill();}}});
  // props as flat 3D plates
  if(!opt.ghost)for(const n in st.props){const def=DATA.props[n],x=st.props[n];
    for(const sh of def.shapes){
      const cr=[[sh[0],sh[1]],[sh[0]+sh[2],sh[1]],[sh[0]+sh[2],sh[1]+sh[3]],[sh[0],sh[1]+sh[3]]].map(([u,v])=>{
        const g=x.r*D,l=[u*Math.cos(g)-v*Math.sin(g),u*Math.sin(g)+v*Math.cos(g),0];return proj(add(x.pos,rotY(l,[0,0,0],x.yaw)),c);});
      const d=cr.reduce((m,q)=>m+q[2],0)/4+(def.layer==="top"?3:def.layer==="back"?-3:.5);
      items.push({d,prop:true,f:()=>{ctx.fillStyle=css(sh[4]||def.color||"--prop1");ctx.beginPath();cr.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();}});
    }}
  items.sort((a,b)=>a.d-b.d);
  for(const it of items)it.f(it.d<hipD-3?far:near);
  ctx.restore();
}

// ---------- page ----------
document.getElementById("title").textContent=DATA.title;
document.getElementById("meta").textContent=DATA.meta;
document.getElementById("note").textContent=DATA.note||"";
document.getElementById("prompt").textContent=DATA.prompt;
const mc=document.getElementById("main"),mx=mc.getContext("2d");
const scrub=document.getElementById("scrub"),readout=document.getElementById("readout"),playBtn=document.getElementById("play");
scrub.min=KEYS[0].f;scrub.max=LAST;
let frame=KEYS[0].f,playing=!matchMedia("(prefers-reduced-motion: reduce)").matches,onion=false,last=0,hold=0;
playBtn.textContent=playing?"Pause":"Play";
const keyIndex=fr=>{let k=0;KEYS.forEach((x,i)=>{if(fr>=x.f-.01)k=i});return k};
function render(){
  mx.fillStyle=css("--panel");mx.fillRect(0,0,mc.width,mc.height);
  if(onion)KEYS.forEach(k=>draw(mx,mc.width,mc.height,keyState(k),{ghost:true}));
  draw(mx,mc.width,mc.height,frameState(frame));
  const k=keyIndex(frame);
  readout.innerHTML=`Frame <b>${String(Math.floor(frame)).padStart(2,"0")}</b> / ${LAST} · key <b>${k+1}</b>`;
  scrub.value=frame;
  document.querySelectorAll(".card").forEach((c,i)=>c.classList.toggle("on",i===k));
}
function tick(t){
  if(playing&&last){const dt=(t-last)/1000;
    if(frame>=LAST){hold+=dt;if(hold>.8){frame=KEYS[0].f;hold=0}}else frame=Math.min(LAST,frame+dt*(DATA.fps||24));}
  last=t;render();requestAnimationFrame(tick);
}
const stop=()=>{playing=false;playBtn.textContent="Play"};
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?"Pause":"Play"};
document.getElementById("onion").onclick=e=>{onion=!onion;e.target.textContent="Onion skin: "+(onion?"on":"off")};
scrub.oninput=()=>{frame=+scrub.value;stop()};
// camera buttons + drag to orbit
const vb=document.getElementById("views");
function setView(name){const v=VIEWS[name];cam.yaw=v[0];cam.pitch=v[1];vb.querySelectorAll("button").forEach(b=>b.classList.toggle("sel",b.dataset.v===name));}
Object.keys(VIEWS).forEach(n=>{const b=document.createElement("button");b.className="ghost";b.dataset.v=n;b.textContent=n[0].toUpperCase()+n.slice(1);b.onclick=()=>setView(n);vb.appendChild(b);});
setView(DATA.view||(is2D?"side":"3/4"));
let drag=null;
mc.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY,cam.yaw,cam.pitch];mc.setPointerCapture(e.pointerId);});
mc.addEventListener("pointermove",e=>{if(!drag)return;cam.yaw=drag[2]-(e.clientX-drag[0])*.5;cam.pitch=Math.max(-10,Math.min(85,drag[3]+(e.clientY-drag[1])*.4));vb.querySelectorAll("button").forEach(b=>b.classList.remove("sel"));});
mc.addEventListener("pointerup",()=>drag=null);
const grid=document.getElementById("grid");
KEYS.forEach((k,i)=>{
  const c=document.createElement("div");c.className="card";c.tabIndex=0;
  c.innerHTML=`<canvas width="400" height="300"></canvas><div class="n">${i+1}</div><p></p><div class="f">frame ${k.f}</div>`;
  c.querySelector("p").textContent=k.n;
  const go=()=>{frame=k.f;stop()};c.onclick=go;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
  grid.appendChild(c);
});
function drawPanels(){document.querySelectorAll(".card canvas").forEach((cv,i)=>{const x=cv.getContext("2d");x.fillStyle=css("--panel");x.fillRect(0,0,cv.width,cv.height);draw(x,cv.width,cv.height,keyState(KEYS[i]),{cam:panelCam})})}
drawPanels();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",drawPanels);
new MutationObserver(drawPanels).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
document.getElementById("copy").onclick=async e=>{
  try{await navigator.clipboard.writeText(DATA.prompt);e.target.textContent="Copied"}
  catch{const r=document.createRange();r.selectNodeContents(document.getElementById("prompt"));const s=getSelection();s.removeAllRanges();s.addRange(r);e.target.textContent="Selected, press Ctrl+C"}
  setTimeout(()=>e.target.textContent="Copy prompt",1800);
};
requestAnimationFrame(tick);
</script>
