<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Person Moves</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--acc:#c2410c;--ok:#15803d;--okbg:#e8f5ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151517;--card:#1e1e21;--ink:#ececee;--mute:#9a9aa0;--line:#2e2e33;--acc:#fb923c;--ok:#4ade80;--okbg:#16301f}}
:root[data-theme="dark"]{--bg:#151517;--card:#1e1e21;--ink:#ececee;--mute:#9a9aa0;--line:#2e2e33;--acc:#fb923c;--ok:#4ade80;--okbg:#16301f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 14px}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.stage canvas{width:100%!important;height:100%!important;display:block}
.hud{position:absolute;left:12px;top:10px;color:#e5e7eb;font:600 13px system-ui;text-shadow:0 1px 2px #000}
.cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff9}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.it{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.it.sel{border-color:var(--acc)}.it.ok{background:var(--okbg)}
.it .tx{flex:1;min-width:0}.it b{display:block;font-size:14px;font-weight:600}.it small{color:var(--mute)}
.chk{width:26px;height:26px;border-radius:6px;border:2px solid var(--mute);background:transparent;padding:0;flex:none;color:#fff;font-weight:700}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
#dbmsg{color:var(--mute);font-size:13px}
</style></head><body><main>
<h1>First Person Moves</h1>
<p class="sub">Game camera (90° field of view). Right hand only, like your TEC-9 shot. Use Pulled-out view to check the hand from any side. Tick a box to approve.</p>
<div class="stage" id="stage"><div class="hud" id="hud"></div><div class="cross"></div></div>
<div class="bar"><button id="play" class="on">Pause</button><button id="slow">Slow motion</button><button id="view">Pulled-out view</button><span id="tip" style="color:var(--mute);font-size:13px" hidden>Drag to turn around the hands · scroll or pinch to zoom</span><span id="dbmsg"></span></div>
<div class="list" id="list"></div>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as T from "three";
const M = __DATA__;
const stage=document.getElementById("stage");
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));stage.prepend(R.domElement);
R.shadowMap.enabled=false;R.toneMapping=T.ACESFilmicToneMapping;
const S=new T.Scene();S.background=new T.Color(0x0b1024);S.fog=new T.Fog(0x0b1024,400,2600);
S.add(new T.HemisphereLight(0x8090c0,0x202020,1.1));const sun=new T.DirectionalLight(0xffffff,1.4);sun.position.set(300,600,200);S.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(8000,8000),new T.MeshStandardMaterial({color:0xb9bcc4,roughness:.9}));floor.rotation.x=-Math.PI/2;S.add(floor);
const grid=new T.GridHelper(8000,80,0x5a5f6a,0x8a8f99);grid.position.y=.2;S.add(grid);
for(const [x,z,w,h,c] of [[-260,-520,90,210,0x3b2a20],[220,-900,500,120,0xd8d8d8],[-700,-1300,200,300,0x444a55],[600,-1600,120,400,0x30343c]]){const b=new T.Mesh(new T.BoxGeometry(w,h,30),new T.MeshStandardMaterial({color:c,roughness:.8}));b.position.set(x,h/2,z);S.add(b);}
const cam=new T.PerspectiveCamera(58.7,16/9,1,6000);cam.rotation.order="YXZ";S.add(cam);
const torch=new T.SpotLight(0xffffff,2.2,0,.5,.6,0);torch.position.set(10,-10,0);torch.target.position.set(0,-40,-400);cam.add(torch,torch.target);
cam.add(new T.PointLight(0xffe6d0,.9,140,1.4));
const arms=new T.Group();cam.add(arms);
const ext=new T.PerspectiveCamera(40,16/9,1,6000);let pulled=false,orb=[35,12],dist=95;
const focus=new T.Vector3(12,-14,-30);
function placeExt(){const a=orb[0]*Math.PI/180,e=orb[1]*Math.PI/180;const p=new T.Vector3(Math.sin(a)*Math.cos(e)*dist,Math.sin(e)*dist,Math.cos(a)*Math.cos(e)*dist).add(focus);
  cam.updateMatrixWorld();ext.position.copy(p.applyMatrix4(cam.matrixWorld));const f=focus.clone().applyMatrix4(cam.matrixWorld);ext.up.set(0,1,0);ext.lookAt(f);}
let dr=null;stage.addEventListener("pointerdown",e=>{if(!pulled)return;dr=[e.clientX,e.clientY,orb[0],orb[1]];stage.setPointerCapture(e.pointerId);});
stage.addEventListener("pointermove",e=>{if(!dr)return;orb=[dr[2]-(e.clientX-dr[0])*.4,Math.max(-60,Math.min(80,dr[3]+(e.clientY-dr[1])*.3))];});
stage.addEventListener("pointerup",()=>dr=null);stage.addEventListener("pointercancel",()=>dr=null);
stage.addEventListener("wheel",e=>{if(!pulled)return;e.preventDefault();dist=Math.max(35,Math.min(260,dist*(e.deltaY>0?1.1:.9)));},{passive:false});
const pts=new Map();stage.addEventListener("touchmove",e=>{if(!pulled||e.touches.length!=2)return;e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pts.has("d"))dist=Math.max(35,Math.min(260,dist*pts.get("d")/d));pts.set("d",d);},{passive:false});
stage.addEventListener("touchend",()=>pts.delete("d"));stage.style.touchAction="pan-y";
const mats=[0xd09a7c,0x334155,0x26282c,0x45484e,0x1b1c1f,0x09090a].map((c,i)=>new T.MeshStandardMaterial({color:c,roughness:i==0?.6:.45,metalness:i>1?.55:0}));
const cyl=new T.CylinderGeometry(1,1,1,14,1,true),sph=new T.SphereGeometry(1,14,10),bx=new T.BoxGeometry(1,1,1);
const capPool=[],boxPool=[];
function getCap(i,col){while(capPool.length<=i){const g=new T.Group();const c=new T.Mesh(cyl,mats[0]),a=new T.Mesh(sph,mats[0]),b=new T.Mesh(sph,mats[0]);g.add(c,a,b);arms.add(g);capPool.push({g,c,a,b});}
  const p=capPool[i];p.c.material=p.a.material=p.b.material=mats[col];p.g.visible=true;return p;}
function getBox(i,col){while(boxPool.length<=i){const m=new T.Mesh(bx,mats[2]);m.matrixAutoUpdate=false;arms.add(m);boxPool.push(m);}const m=boxPool[i];m.material=mats[col];m.visible=true;return m;}
const flash=new T.Mesh(new T.SphereGeometry(1,10,8),new T.MeshBasicMaterial({color:0xffd27a}));arms.add(flash);const fl=new T.PointLight(0xffb050,0,600,1.2);arms.add(fl);
const Y=new T.Vector3(0,1,0),va=new T.Vector3(),vb=new T.Vector3(),d=new T.Vector3(),m4=new T.Matrix4(),X=new T.Vector3(),Yv=new T.Vector3(),Z=new T.Vector3();
function draw(f){
  const [cp,cy,cr,cx,cyy,cz]=f.cam;const D=Math.PI/180;cam.position.set(cx,170+cyy,cz);cam.rotation.set(cp*D,cy*D,cr*D);
  f.c.forEach((c,i)=>{const p=getCap(i,c[7]);va.set(c[0],c[1],c[2]);vb.set(c[3],c[4],c[5]);d.subVectors(vb,va);const L=d.length();
    p.c.position.addVectors(va,vb).multiplyScalar(.5);p.c.scale.set(c[6],L,c[6]);p.c.quaternion.setFromUnitVectors(Y,d.normalize());
    p.a.position.copy(va);p.a.scale.setScalar(c[6]);p.b.position.copy(vb);p.b.scale.setScalar(c[6]);});
  for(let i=f.c.length;i<capPool.length;i++)capPool[i].g.visible=false;
  f.b.forEach((b,i)=>{const m=getBox(i,b[12]);X.set(b[3],b[4],b[5]);Yv.set(b[6],b[7],b[8]);Z.set(b[9],b[10],b[11]);m.matrix.makeBasis(X,Yv,Z).setPosition(b[0],b[1],b[2]);});
  for(let i=f.b.length;i<boxPool.length;i++)boxPool[i].visible=false;
  const on=f.f==1;flash.visible=on;fl.intensity=on?4:0;if(on){flash.position.set(f.m[0]+f.m[3]*3,f.m[1]+f.m[4]*3,f.m[2]+f.m[5]*3);flash.scale.setScalar(3+Math.random()*1.5);fl.position.copy(flash.position);}
}
let cur=0,fi=0,playing=true,slow=false,acc=0,last=performance.now(),hold=0;
function resize(){const w=stage.clientWidth;R.setSize(w,w*9/16,false);}addEventListener("resize",resize);resize();
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;const m=M[cur];
  if(playing){acc+=dt*(slow?.25:1);while(acc>=1/30){acc-=1/30;if(hold>0){hold--;continue;}fi++;if(fi>=m.fr.length){fi=0;if(!m.loop)hold=15;}}}
  draw(m.fr[fi]);if(pulled){placeExt();R.render(S,ext);}else R.render(S,cam);document.getElementById("hud").textContent=m.t;requestAnimationFrame(tick);}
window.__pull=(a,e,d)=>{pulled=true;orb=[a,e];dist=d;};window.__show=(i,f)=>{cur=i;fi=Math.min(f,M[i].fr.length-1);playing=false;hold=0;paint();};
requestAnimationFrame(tick);
const list=document.getElementById("list");const approved=new Set();let db=null;
M.forEach((m,i)=>{const el=document.createElement("div");el.className="it";el.innerHTML=`<button class="chk" aria-label="Approve" aria-pressed="false" hidden>✓</button><div class="tx"><b></b><small></small></div>`;
  el.querySelector("b").textContent=m.t;el.querySelector("small").textContent=(m.loop?"loop":"one-shot")+" · "+m.sec+"s";
  el.onclick=e=>{if(e.target.classList.contains("chk")){toggle(m.n);return;}cur=i;fi=0;hold=0;paint();};m.el=el;list.appendChild(el);});
function paint(){M.forEach((m,i)=>{m.el.classList.toggle("sel",i==cur);const on=approved.has(m.n);m.el.classList.toggle("ok",on);m.el.querySelector(".chk").setAttribute("aria-pressed",on);});}
paint();
document.getElementById("play").onclick=e=>{playing=!playing;e.target.textContent=playing?"Pause":"Play";e.target.classList.toggle("on",playing);};
document.getElementById("view").onclick=e=>{pulled=!pulled;e.target.classList.toggle("on",pulled);e.target.textContent=pulled?"Game view":"Pulled-out view";
  document.getElementById("tip").hidden=!pulled;document.querySelector(".cross").style.display=pulled?"none":"";stage.style.touchAction=pulled?"none":"pan-y";};
document.getElementById("slow").onclick=e=>{slow=!slow;e.target.classList.toggle("on",slow);};
const pending=new Set();
async function toggle(n){if(!db||pending.has(n))return;pending.add(n);const on=approved.has(n);on?approved.delete(n):approved.add(n);paint();
  try{const ref=db.collection("approvals").doc(n);on?await ref.delete():await ref.set({approved:true,at:new Date().toISOString()});}
  catch(e){on?approved.add(n):approved.delete(n);paint();document.getElementById("dbmsg").textContent="Couldn't save that change.";}finally{pending.delete(n);}}
(async()=>{const msg=document.getElementById("dbmsg");msg.textContent="Loading approvals…";
  try{db=await window.claude?.use?.("db");}catch(e){}
  if(!db){msg.textContent="Approvals work when the page is open on claude.ai.";return;}
  document.querySelectorAll(".chk").forEach(c=>c.hidden=false);
  db.collection("approvals").onSnapshot(s=>{msg.textContent="Saved automatically.";approved.clear();s.docs.forEach(x=>{if(x.exists)approved.add(x.id)});paint();},()=>{msg.textContent="Couldn't load approvals.";});})();
</script></body></html>
